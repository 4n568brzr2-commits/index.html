<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #2a1118 0%, #12090d 35%, #050505 75%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 480px;
      padding: 40px 25px;
      position: relative;
      z-index: 2;
      animation: fadeIn 2s ease forwards;
    }

    .rose {
      font-size: 58px;
      margin-bottom: 22px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255, 80, 110, 0.25));
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 42px;
      letter-spacing: 1px;
      margin-bottom: 18px;
      opacity: 0;
      animation: appear 1.5s ease forwards 0.8s;
    }

    .line {
      width: 65px;
      height: 1px;
      background: rgba(255,255,255,0.5);
      margin: 0 auto 28px;
      opacity: 0;
      animation: appear 1.5s ease forwards 1.4s;
    }

    .message {
      font-size: 18px;
      line-height: 1.8;
      color: rgba(255,255,255,0.88);
      opacity: 0;
      animation: appear 1.8s ease forwards 2s;
    }

    .final {
      margin-top: 30px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-style: italic;
      opacity: 0;
      animation: appear 1.8s ease forwards 3.2s;
    }

    .heart {
      display: inline-block;
      margin-top: 22px;
      font-size: 24px;
      opacity: 0;
      animation: heartBeat 2s ease infinite 4.3s,
                 appear 1.2s ease forwards 4s;
    }

    .petal {
      position: absolute;
      top: -10%;
      font-size: 18px;
      opacity: 0.45;
      animation: fall linear infinite;
      z-index: 1;
      user-select: none;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.45;
      }
      100% {
        transform: translateY(120vh) rotate(420deg);
        opacity: 0;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 36px;
      }

      .message {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="petal" style="left:8%; animation-duration:11s; animation-delay:0s;">🌹</div>
  <div class="petal" style="left:22%; animation-duration:14s; animation-delay:2s;">🌹</div>
  <div class="petal" style="left:38%; animation-duration:12s; animation-delay:5s;">🌹</div>
  <div class="petal" style="left:55%; animation-duration:15s; animation-delay:1s;">🌹</div>
  <div class="petal" style="left:72%; animation-duration:13s; animation-delay:4s;">🌹</div>
  <div class="petal" style="left:88%; animation-duration:16s; animation-delay:3s;">🌹</div>

  <div class="container">
    <div class="rose">🌹</div>

    <h1>Happy Birthday</h1>

    <div class="line"></div>

    <div class="message">
      May today bring you a little more peace,
      a little more joy,
      and many reasons to smile.
      <br><br>
      Forget everything heavy for a while
      and simply enjoy your day.
    </div>

    <div class="final">
      You deserve a beautiful birthday.
    </div>

    <div class="heart">♡</div>
  </div>

</body>
</html>
